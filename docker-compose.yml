# DeepSeek Harness (dsh) 容器化部署
# 用法: docker compose up -d        (首次)
#       docker compose pull && docker compose up -d   (升级)
services:
  dsh:
    image: ghcr.io/snailium/dsh-container/dsh:latest
    build:
      context: .
      args:
        # DSH_VERSION 强制必填(:?): 不再有默认值。缺省直接报错,
        #   避免"静默构建过期版本"(Dockerfile/compose/.env 三处漂移的根因, 见 review v7)。
        DSH_VERSION: ${DSH_VERSION:?请在 .env 设置 DSH_VERSION=上游 dsh npm 版本, 例如 0.2.0-rc.2}
    container_name: dsh
    restart: unless-stopped        # 替代 systemd 的重启策略
    # host 网络: 直接访问 .101/.102 模型端点 + relay 绑任意端口, 免端口映射
    network_mode: host
    environment:
      # --- 数据卷根 ---
      DSH_HOME: /dsh-home
      # --- 上游/端点凭据 (llama.cpp/vLLM 不校验 key 值, 但 dsh 依此做存在性检查) ---
      OLLAMA_API_KEY: ollama-local
      B70_API_KEY: local-b70
      # --- HTTPS 访问端口 (env 可改, 避免端口冲突) ---
      DSH_HTTPS_PORT: ${DSH_HTTPS_PORT:-8443}
      # --- relay 绑定范围 (安全默认) ---
      # 默认 loopback(仅本机) —— relay 把外部 Host 重写成受信权威, 绑全网等于把
      # dsh 的 agent 能力开放给整个网段, 而 dsh 自身零认证(见 README 安全节)。
      # 要开放给局域网/全网: 设 DSH_RELAY_BIND=0.0.0.0, 并**必须**外挂安全插件
      # (如 dsh-mobile 做认证网关) —— 详见 README "开放局域网访问" 节。
      DSH_RELAY_BIND: ${DSH_RELAY_BIND:-127.0.0.1}
      # --- 受信权威(relay把外部 Host 重写为它) ---
      # DSH_LAN_IP: 绑全网时必填(证书 SAN + relay 权威来源)。
      #   绑 loopback 时可留空 —— 此时权威自动回落 127.0.0.1, 无需知道本机 IP。
      DSH_LAN_IP: ${DSH_LAN_IP:-}
      #   DSH_TRUSTED_AUTHORITY 不设则自动 = ${DSH_LAN_IP:-127.0.0.1}:${DSH_WEB_PORT} (见 P1, 跟随 web 端口)。
      #   ⚠️ 此值必须与 entrypoint 传给 dsh 的 --trusted-host 一致(Origin 校验: origin.host===host.host)。
      DSH_TRUSTED_AUTHORITY: ${DSH_TRUSTED_AUTHORITY:-${DSH_LAN_IP:-127.0.0.1}:${DSH_WEB_PORT:-3080}}
      # --- dsh web 监听 ---
      DSH_WEB_PORT: ${DSH_WEB_PORT:-3080}
    # 数据卷: 路径在 .env 里填(DSH_DATA_DIR / DSH_WORKSPACE_DIR), 仓库不含内部路径
    #   DSH_DATA_DIR     → $DSH_HOME(settings/sessions/profiles/TLS)
    #   DSH_WORKSPACE_DIR→ 工作区宿主目录, 挂到容器内 /workspace(工作区宿主路径, 见 README)
    # 两者均强制必填(:?)——缺失会静默挂载 root 属主的默认路径, node 用户写不进去(见 review S4)
    volumes:
      - ${DSH_DATA_DIR:?请在 .env 设置 DSH_DATA_DIR=harness-home 宿主路径}:/dsh-home
      # 工作区挂到容器内固定 /workspace(宿主工作区目录, UI 新建工作区选 /workspace)
      - ${DSH_WORKSPACE_DIR:?请在 .env 设置 DSH_WORKSPACE_DIR=工作区宿主目录}:/workspace
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"