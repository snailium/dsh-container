# DeepSeek Harness (dsh) 容器化部署
# 用法: docker compose up -d        (首次)
#       docker compose pull && docker compose up -d   (升级)
services:
  dsh:
    image: ghcr.io/snailium/dsh-container/dsh:latest
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.1-rc.2}   # 绑 npm version; 可用 .env 覆盖
    container_name: dsh
    restart: unless-stopped        # 替代 systemd 的重启策略
    # host 网络: 直接访问 .101/.102 模型端点 + relay 绑任意端口, 免端口映射
    network_mode: host
    environment:
      # --- 数据卷根 ---
      DSH_HOME: /dsh-home
      # --- 上游/端点凭据 (llama.cpp/vLLM 不校验 key 值, 但 dsh 依此做存在性检查) ---
      OLLAMA_API_KEY: ollama-local
      B70_API_KEY: local-b70
      # --- HTTPS 访问端口 (env 可改, 避免端口冲突) ---
      DSH_HTTPS_PORT: ${DSH_HTTPS_PORT:-8443}
      # --- 受信权威(relay把外部 Host 重写为它); 真实 IP 经 .env 注入 ---
      #     copy .env.example → .env, 填你实际的局域网 IP
      DSH_LAN_IP: ${DSH_LAN_IP:-localhost}
      DSH_TRUSTED_AUTHORITY: ${DSH_LAN_IP:-localhost}:3080
      # --- dsh web 监听 ---
      DSH_WEB_PORT: ${DSH_WEB_PORT:-3080}
    # 数据卷: 路径在 .env 里填(DSH_DATA_DIR / DSH_WORKSPACE_DIR), 仓库不含内部路径
    #   DSH_DATA_DIR     → $DSH_HOME(settings/sessions/profiles/TLS)
    #   DSH_WORKSPACE_DIR→ Telegram 机器人绑定的工作区, 必须同路径挂载
    volumes:
      - ${DSH_DATA_DIR:-/data/harness-home}:/dsh-home
      # 工作区同路径挂载(dsh-im workspace 绑定), 缺失会导致会话记录错乱分叉
      - ${DSH_WORKSPACE_DIR:-/data/deepseek-harness}:${DSH_WORKSPACE_DIR:-/data/deepseek-harness}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"