name: Auto-update dsh image

# dsh 版本由 Dockerfile DSH_VERSION 决定(手动 bump), CI 读取该值作为镜像 tag。
# schedule / workflow_dispatch 触发重建 + 冒烟验证 + 推 ghcr; push 只跑测试不推镜像。
on:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时
  workflow_dispatch:        # 手动触发
    inputs:
      force:
        description: '强制重建并推送(即使版本已存在)'
        required: false
        type: boolean
        default: false
  push:                     # push 到 master 时跑测试(不推镜像, 见 push-test job)
    branches: [master]

# GITHUB_TOKEN 对当前仓库的 repo-scoped 容器包有 packages:write(推镜像)
permissions:
  packages: write
  contents: read

env:
  # repo-scoped 包: ghcr.io/snailium/<repo>/<img> — GITHUB_TOKEN 即可推(关联当前 repo)
  #   user-scoped(ghcr.io/snailium/...) 需额外 PAT, GITHUB_TOKEN 会 denied
  IMAGE: ghcr.io/snailium/dsh-container/dsh

jobs:
  check-and-build:
    # 仅 schedule / workflow_dispatch 触发(不会因 push 跑)；push 走 push-test job
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 查上游 dsh 版本 (Dockerfile DSH_VERSION)
        id: npm
        run: |
          V=$(grep '^ARG DSH_VERSION=' Dockerfile | cut -d= -f2)
          echo "latest=$V" >> "$GITHUB_OUTPUT"
          echo "upstream dsh version (from Dockerfile): $V"

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查是否已有该版本镜像
        id: probe
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.npm.outputs.latest }}"
          # force 输入强制重建(跳过"已存在"检查); 否则版本已存在则跳过
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "ALREADY_EXISTS=0" >> "$GITHUB_ENV"
            echo "force rebuild — $V"
          elif docker manifest inspect "${IMAGE}:${V}" >/dev/null 2>&1; then
            echo "ALREADY_EXISTS=1" >> "$GITHUB_ENV"
            echo "$V already built — skip"
          else
            echo "ALREADY_EXISTS=0" >> "$GITHUB_ENV"
            echo "new version $V — building"
          fi

      - name: 检出源码(含 Dockerfile/entrypoint/relay/test)
        if: env.ALREADY_EXISTS == '0'
        uses: actions/checkout@v4

      - name: 构建镜像(仅 build+load, 不 push)
        if: env.ALREADY_EXISTS == '0'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: DSH_VERSION=${{ steps.npm.outputs.latest }}
          load: true
          tags: |
            smoke:latest
          ### build-push-action 的 tags 用固定本地名; 冒烟通过后再手动推送(见下) ###

      - name: 仓库内单元测试(relay 纯函数)
        if: env.ALREADY_EXISTS == '0'
        run: node docker/test/dsh-tls-relay.test.js

      - name: 冒烟测试(起容器, 验证书/web/relay/非root)
        if: env.ALREADY_EXISTS == '0'
        run: bash docker/test/smoke.sh smoke:latest

      - name: 推送镜像到 ghcr(冒烟通过后)
        if: env.ALREADY_EXISTS == '0'
        run: |
          V="${{ steps.npm.outputs.latest }}"
          docker tag smoke:latest "${IMAGE}:${V}"
          docker tag smoke:latest "${IMAGE}:latest"
          docker push "${IMAGE}:${V}"
          docker push "${IMAGE}:latest"
          echo "pushed ${IMAGE}:${V} + :latest"

  # --- push 到 master 时自动跑测试: 校验本轮改动(entrypoint/relay/Dockerfile)不破坏构建与运行 ---
  # 只 build+测试, 不推镜像(镜像更新仍由 check-and-build 的 schedule/manual 负责)
  push-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 查上游 dsh 版本 (Dockerfile DSH_VERSION)
        id: npm
        run: |
          V=$(grep '^ARG DSH_VERSION=' Dockerfile | cut -d= -f2)
          echo "latest=$V" >> "$GITHUB_OUTPUT"
          echo "upstream dsh version (from Dockerfile): $V"

      - name: entrypoint / smoke 语法检查 (bash -n)
        run: |
          bash -n docker/entrypoint.sh
          bash -n docker/test/smoke.sh

      - name: 构建镜像 (仅 build+load, 不 push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 对着"将上线的 npm latest 版本"验证仓库改动, 而非 Dockerfile 默认版本(review G1)。
          # 用 ${{ steps.npm.outputs.latest }} 表达式, 勿用 ${DSH_VERSION:-...} shell 语法:
          # GH Actions 的 with 不做 shell 展开, 会原样传成非法 npm tag(见 EINVALIDTAGNAME)。
          build-args: DSH_VERSION=${{ steps.npm.outputs.latest }}
          load: true
          tags: |
            smoke:latest

      - name: 仓库内单元测试 (relay 纯函数)
        run: node docker/test/dsh-tls-relay.test.js

      - name: 冒烟测试 (起容器, 验证书/web/relay/非root/自愈)
        run: bash docker/test/smoke.sh smoke:latest