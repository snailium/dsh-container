# dsh profile root — composed from package.json bundles + cordis.patch.yml.
# headless 测试 profile 模板: base+headless + web 搜索 + repeat-tool-breaker。
# 默认模型/provider 由使用方在 DSH_HOME/settings.yaml 或 --patch 指定。
# dsh-repeat-tool-breaker 无 dsh.bundle 字段, 通过 cordis patch 挂载(非 bundle)。
- insert:
    - id: repeat-tool-breaker
      name: dsh-repeat-tool-breaker
      config:
        denyAfter: 2
        warnAfter: 1
        registerAdvisory: true
        exclude:
          - todo_write
        include: []
        readTools:
          - read
          - Read
          - read_file
          - read-file
          - file-read
          - fs-read
        matchReadBySubstring: true
        pathAliases:
          - path
          - filePath
          - file
          - target_file
        maxSamePath: 3
        previewChars: 400
        resultPreviewChars: 800
